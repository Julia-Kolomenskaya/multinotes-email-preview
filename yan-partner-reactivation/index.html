<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>РСЯ · Реактивация партнёров — согласование писем</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#191e28;font-family:Arial,sans-serif}main{max-width:1040px;margin:auto;padding:40px 24px 64px}header{margin-bottom:24px}.eyebrow{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#655e77}h1{font-size:32px;line-height:1.15;letter-spacing:-.7px;margin:12px 0}header p{line-height:1.5;color:#596374;margin:8px 0}.controls{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.tabs{display:flex;gap:6px;padding:5px;background:#e7eaf0;border-radius:14px}button{border:0;background:transparent;font:600 14px Arial;padding:11px 16px;cursor:pointer;border-radius:10px;color:#596374}button[aria-selected=true],button[aria-pressed=true]{background:#fff;color:#191e28;box-shadow:0 1px 4px #0001}button:focus-visible,a:focus-visible{outline:3px solid #b9b2ff;outline-offset:3px}.meta{border:1px solid #e1e5ed;background:white;border-radius:18px;padding:22px 24px;margin-bottom:24px}.meta dl{margin:0;display:grid;grid-template-columns:85px 1fr;gap:12px}dt{color:#7b8493;font-size:13px;line-height:22px}dd{margin:0;font-size:16px;line-height:22px;overflow-wrap:anywhere}.meta a{display:inline-block;margin-top:18px;color:#4b3cff;font-size:14px;text-decoration:none}.stage{display:flex;justify-content:center;padding:24px 8px;background:#e7ebf1;border-radius:24px}.frame-wrap{width:600px;max-width:100%;background:#fff;box-shadow:0 6px 28px #23304b12;border-radius:14px;overflow:hidden;transition:width .2s}iframe{display:block;border:0;width:100%;height:1800px}footer{padding-top:20px;font-size:12px;color:#7b8493;line-height:1.5}@media(max-width:620px){main{padding:24px 12px 40px}h1{font-size:27px}.meta{padding:18px 16px}.meta dl{grid-template-columns:1fr;gap:6px}dd{margin-bottom:8px}.controls{gap:12px}.stage{padding:12px 0;border-radius:16px}button{padding:10px 13px}}
</style></head><body><main><header><div class="eyebrow">Рекламная сеть Яндекса</div><h1>Письма на согласование</h1><p>Реактивация партнёров · Medium priority</p><p>Светлая тема · Вариант с галочками · RU: версия 8 · EN/CN: версия 6</p></header><div class="controls"><nav class="tabs" aria-label="Язык письма" role="tablist"><button type="button" data-lang="ru" role="tab" aria-selected="true">RU</button><button type="button" data-lang="en" role="tab" aria-selected="false">EN</button><button type="button" data-lang="cn" role="tab" aria-selected="false">CN</button></nav><div class="tabs" aria-label="Размер предпросмотра"><button type="button" data-size="600" aria-pressed="true">Компьютер</button><button type="button" data-size="360" aria-pressed="false">Телефон</button></div></div><section class="meta" aria-label="Тема и прехедер"><dl><dt>Тема</dt><dd id="subject"></dd><dt>Прехедер</dt><dd id="preheader"></dd></dl><a id="direct" href="ru/email.html" target="_blank" rel="noopener">Открыть письмо отдельно ↗</a></section><section class="stage" aria-label="Предпросмотр письма"><div class="frame-wrap" id="frame-wrap"><iframe id="email" src="ru/email.html?v=8" title="Письмо — русский язык"></iframe></div></section><footer>Материалы для согласования · Обновлено 20 ноября 2026</footer></main><script>
const letters={"ru": {"subject": "Приостановили показы рекламы от РСЯ?", "preheader": "Расскажите о причинах — мы поможем найти решение", "file": "ru/email.html?v=8", "label": "Русский"}, "en": {"subject": "Have you paused ads from the Yandex Advertising Network?", "preheader": "Let us know why, and we’ll help you find a solution", "file": "en/email.html?v=6", "label": "English"}, "cn": {"subject": "您是否暂停了 Yandex Advertising Network 的广告？", "preheader": "如果可以，请告知我们原因，我们将帮助您寻找解决方案", "file": "cn/email.html?v=6", "label": "中文"}};const frame=document.getElementById('email'),wrap=document.getElementById('frame-wrap');
function fit(){try{frame.style.height=Math.max(frame.contentDocument.documentElement.scrollHeight,frame.contentDocument.body.scrollHeight)+'px'}catch(e){}}
function select(lang){if(!letters[lang])lang='ru';const item=letters[lang];document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.lang===lang)));document.getElementById('subject').textContent=item.subject;document.getElementById('preheader').textContent=item.preheader;document.getElementById('direct').href=item.file;frame.title='Письмо — '+item.label;frame.style.height='1800px';frame.src=item.file;history.replaceState(null,'','#'+lang)}
frame.addEventListener('load',()=>{fit();setTimeout(fit,200);try{frame.contentDocument.querySelectorAll('a').forEach(a=>{if((a.getAttribute('href')||'').includes('{{'))a.addEventListener('click',e=>e.preventDefault())})}catch(e){}});
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.lang)));
document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));wrap.style.width=b.dataset.size+'px';setTimeout(fit,240)}));window.addEventListener('resize',fit);select(location.hash.slice(1));
</script></body></html>
