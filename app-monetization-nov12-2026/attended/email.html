    const bytes = Uint8Array.from(atob(encoded), c => c.charCodeAt(0));
    const email = document.getElementById('email');
    const frame = document.getElementById('frame');
    const resize = () => {
      try {
        const height = Math.max(700, email.contentDocument.documentElement.scrollHeight, email.contentDocument.body.scrollHeight);
        email.style.height = height + 'px';
        frame.style.minHeight = height + 'px';
      } catch (_) {}
    };
    email.addEventListener('load', () => { resize(); setTimeout(resize, 150); });
    email.srcdoc = new TextDecoder().decode(bytes);
    const activate = button => {
      document.querySelectorAll('[data-width]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      frame.style.width = button.dataset.width + 'px';
      setTimeout(resize, 250);
    };
    document.querySelectorAll('[data-width]').forEach(button => button.addEventListener('click', () => activate(button)));
    const requestedWidth = new URLSearchParams(location.search).get('width');
    const requestedButton = document.querySelector(`[data-width="${requestedWidth}"]`);
    if (requestedButton) activate(requestedButton);
